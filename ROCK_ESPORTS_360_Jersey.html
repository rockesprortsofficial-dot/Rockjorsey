const labels=["FRONT", "LEFT 45\u00b0", "LEFT SIDE", "BACK LEFT", "BACK", "BACK RIGHT", "RIGHT SIDE", "RIGHT 45\u00b0"];
let idx=0, auto=false, timer=null, lastX=0, dragging=false;
const img=document.getElementById('jersey'), viewer=document.getElementById('viewer'), name=document.getElementById('name'), dots=document.getElementById('dots');
images.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.onclick=()=>show(i);dots.appendChild(b)});
function show(i){idx=(i+images.length)%images.length;img.src=images[idx];name.textContent=labels[idx];[...dots.children].forEach((d,j)=>d.classList.toggle('active',j===idx));}
function step(d){show(idx+d)}
function begin(x){dragging=true;lastX=x}
function move(x){if(!dragging)return;const dx=x-lastX;if(Math.abs(dx)>24){step(dx<0?1:-1);lastX=x}}
function end(){dragging=false}
viewer.addEventListener('touchstart',e=>begin(e.touches[0].clientX),{passive:true});
viewer.addEventListener('touchmove',e=>move(e.touches[0].clientX),{passive:true});
viewer.addEventListener('touchend',end);
viewer.addEventListener('mousedown',e=>begin(e.clientX));
window.addEventListener('mousemove',e=>move(e.clientX));
window.addEventListener('mouseup',end);
document.getElementById('prev').onclick=()=>step(-1);
document.getElementById('next').onclick=()=>step(1);
document.getElementById('auto').onclick=()=>{auto=!auto;document.getElementById('auto').textContent=auto?'⏸ STOP ROTATE':'▶ AUTO ROTATE';if(auto)timer=setInterval(()=>step(1),650);else clearInterval(timer)};
show(0);
</script>
